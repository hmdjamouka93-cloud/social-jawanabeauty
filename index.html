<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل مع صالون جوانا بيوتي</title>
    <!-- استدعاء مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fdfbf7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 15px;
            color: #333333;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        /* تعديل حجم اللوغو ليناسب الهاتف تماماً وبشكل دائري فخم */
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        h1 {
            color: #b38f27;
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        p.subtitle {
            color: #777777;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        .link-btn:active {
            transform: scale(0.98);
        }
        /* ألوان الأزرار والأيقونات */
        .btn-facebook { background-color: #1877F2; }
        .btn-instagram { background: linear-space(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); background: linear-gradient(45deg, #f09433 0%, #e6683c 50%, #dc2743 100%); }
        .btn-tiktok { background-color: #000000; color: #ffffff; border: 1px solid #333; }
        
        .link-btn i {
            font-size: 20px;
        }
        .footer {
            margin-top: 25px;
            color: #999999;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة اللوغو -->
        <div class="logo-container">
            <img src="Messenger_creation_C72ECA9C-FFD4-4D4D-A5E0-488C3CECA91A.jpeg" alt="شعار صالون جوانا بيوتي">
        </div>

        <h1>صالون جوانا بيوتي</h1>
        <p class="subtitle">تابعونا على صفحاتنا الرسمية</p>

        <!-- روابط التواصل -->
        <div class="links-container">
            <!-- فيسبوك -->
            <a href="https://www.facebook.com/share/1bbkN8Lw1H/?mibextid=wwXIfr" target="_blank" class="link-btn btn-facebook">
                <i class="fa-brands fa-facebook"></i>
                <span>صفحتنا على فيسبوك</span>
            </a>

            <!-- إنستغرام -->
            <a href="https://www.instagram.com/asraraljamal.qr" target="_blank" class="link-btn btn-instagram">
                <i class="fa-brands fa-instagram"></i>
                <span>حسابنا على إنستغرام</span>
            </a>

            <!-- تيك توك -->

                <i class="fa-brands fa-tiktok"></i>
                <span>حسابنا على تيك توك</span>
            </a>
        </div>

        <div class="footer">
            <p>جميع الحقوق محفوظة © صالون جوانا بيوتي</p>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل مع صالون جوانا بيوتي</title>
    <!-- استدعاء مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fdfbf7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 15px;
            color: #333333;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .profile-card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0d5c1;
        }
        /* عرض اللوجو بأبعاده الأصلية بدون إطار مدور */
        .logo-container {
            width: 100%;
            max-width: 180px;
            margin: 0 auto 20px auto;
        }
        .logo-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        h1 {
            color: #b8860b;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        p.subtitle {
            color: #777777;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .social-button:active {
            transform: scale(0.98);
        }
        /* زر فيسبوك */
        .facebook {
            background-color: #1877F2;
        }
        /* زر انستغرام */
        .instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        /* زر تيك توك */
        .tiktok {
            background-color: #000000;
        }
        .social-button i {
            font-size: 22px;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            
            <!-- صورة اللوجو الأصلية -->
            <div class="logo-container">
                <img src="logo.jpg" alt="شعار صالون جوانا بيوتي" class="logo">

            
            <h1>صالون جوانا بيوتي</h1>
            <p class="subtitle">تابعونا على صفحاتنا الرسمية</p>

            <div class="links-container">
                <!-- رابط فيسبوك -->
                <a href="https://www.facebook.com/share/1CMukKAUBj/?mibextid=wwXIfr" target="_blank" class="social-button facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span>صفحتنا على فيسبوك</span>
                </a>

                <!-- رابط انستغرام -->
                <a href="https://www.instagram.com/jawana.qr?igsh=MTg2ejM5N3IxazBybw==" target="_blank" class="social-button instagram">
                    <i class="fa-brands fa-instagram"></i>
                    <span>حسابنا على انستغرام</span>
                </a>

                <!-- رابط تيك توك -->
                <a href="https://www.tiktok.com/@jawanabeauty?_r=1&_t=ZN-98qjejJZS2o" target="_blank" class="social-button tiktok">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>حسابنا على تيك توك</span>
                </a>
            </div>

        </div>
        <div class="footer">
            <p>جميع الحقوق محفوظة © صالون جوانا بيوتي</p>
        </div>
    </div>

</body>
</html>
